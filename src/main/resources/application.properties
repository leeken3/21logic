spring.application.name=BlackJackStack
server.port=${PORT:8080}

# Comma-separated frontend origins allowed to call /api/**.
# Override this in the deployment environment with the deployed frontend URL.
21logic.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}

# AI Coach configuration
21logic.ai.enabled=${AI_ENABLED:false}
21logic.ai.provider=${AI_PROVIDER:groq}
21logic.ai.model=${AI_MODEL:openai/gpt-oss-120b}
21logic.ai.api-key=${AI_API_KEY:}
21logic.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:20}

# Hosted provider endpoints
21logic.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
21logic.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
